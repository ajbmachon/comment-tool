[project]
name = "comment-tool"
version = "0.1.0"
description = "Classify code comments with closed Jev questions composed by code; the caller acts on the rows"
requires-python = ">=3.13"
dependencies = ["jev-navigator @ git+https://github.com/ajbmachon/jev-navigator"]

[dependency-groups]
dev = ["pytest", "ruff", "ast-grep-cli"]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["*_test.py"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
