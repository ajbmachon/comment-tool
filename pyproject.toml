[project]
name = "comment-tool"
version = "0.1.0"
description = "Classify code comments with closed Jev questions composed by code; the caller acts on the rows"
requires-python = ">=3.13"
dependencies = ["jev-navigator @ git+https://github.com/ajbmachon/jev-navigator"]

[dependency-groups]
dev = ["pytest", "ruff", "ast-grep-cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/comment_tool"]
artifacts = ["**/*.mjs"]

[tool.uv]
package = true

[project.scripts]
comment-tool = "comment_tool.cli.classify:main"
comment-sweep = "comment_tool.cli.sweep:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
